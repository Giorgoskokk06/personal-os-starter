schema_version: "4.0"
engine: "Personal OS Multi-Perspective Macro & Geopolitical Intelligence Engine"
last_calibrated: "2026-11-25"

# 1. Analytical Relevance Weights (Engineering & Portfolio Neutrality)
profile_relevance_weights:
  energy_inflation_macro: 0.30
  maritime_logistics_corridors: 0.25
  semiconductor_supply_chain: 0.25
  european_industrial_policy: 0.20

# 2. Structural & Historical Baselines (Game-Theory Reference Models)
historical_doctrines:
  government_debt_market_pricing:
    id: "government_debt_market_pricing"
    title: "Capital Market Risk Pricing vs. Media Sensationalism (Market Reality Check)"
    year: "1990-2026"
    summary: "Government bond spreads, credit default swaps (CDS), FX implied volatility, and commodity forward curves reprice kinetic or systemic risk far earlier than television or social media commentary."
    game_theory_reality: "Media outlets optimize for attention via alarmist framing, whereas institutional capital bears financial loss for mispricing risk. Flat bond spreads, FX volatility, and freight curves typically signal rhetorical noise rather than acute structural disruption."
    red_line_trigger: "Sustained >25 bps government bond spread widening paired with >5% intraday commodity/freight repricing and capital-control advisories."
    keywords:
      - "bond yield"
      - "spread"
      - "cds"
      - "fx"
      - "treasury"
      - "bund"
      - "ecb"
      - "fed"
      - "interest rate"
      - "inflation"
      - "credit"

  maritime_chokepoint_elasticity:
    id: "maritime_chokepoint_elasticity"
    title: "Maritime Chokepoints & Freight Elasticity (Suez, Hormuz, Malacca, Panama)"
    year: "1956-2026"
    summary: "Localized disruption at critical maritime straits induces vessel rerouting (e.g., via Cape of Good Hope) and elevated war-risk insurance premia without automatically collapsing global physical trade."
    game_theory_reality: "Shipping alliances dynamically re-price TEU/ton-mile rates and adjust routing elasticity. Only a sustained physical naval blockade of multiple energy chokepoints produces a structural supply shock."
    red_line_trigger: "Verified commercial strait closure, formal naval blockade, or simultaneous suspension of major marine war-risk underwriting."
    keywords:
      - "red sea"
      - "suez"
      - "hormuz"
      - "malacca"
      - "panama canal"
      - "shipping"
      - "maritime"
      - "freight"
      - "tanker"
      - "chokepoint"
      - "unclos"
      - "naval"

  energy_buffer_equilibrium:
    id: "energy_buffer_equilibrium"
    title: "Energy Markets & Strategic Storage Buffers (Brent, TTF, OPEC+ Spare Capacity)"
    year: "1973-2026"
    summary: "Global crude (Brent) and European gas (TTF) benchmarks absorb headline geopolitical volatility through strategic petroleum reserves, LNG regasification terminals, and spare producer capacity."
    game_theory_reality: "Short-lived price spikes from rhetorical threats quickly mean-revert unless physical export infrastructure, pipeline capacity, or tanker loading terminals suffer verified multi-week outages."
    red_line_trigger: "Physical destruction of export terminals or sustained Brent > $120/bbl alongside depleted European gas storage."
    keywords:
      - "brent"
      - "crude"
      - "ttf"
      - "lng"
      - "opec"
      - "oil"
      - "natural gas"
      - "energy"
      - "storage"
      - "pipeline"

  semiconductor_export_bifurcation:
    id: "semiconductor_export_bifurcation"
    title: "Semiconductor Supply Chain & Export Control Bifurcation (BIS / EUV / CoWoS)"
    year: "2019-2026"
    summary: "Multi-year structural competition over leading-edge lithography, advanced packaging (CoWoS/HBM), export licensing, and critical mineral refining."
    game_theory_reality: "Supply chain bifurcation operates on multi-quarter capex and fab-construction cycles rather than overnight shocks, directly affecting cloud compute pricing and hardware lead times."
    red_line_trigger: "Immediate embargo on foundry shipments, critical subsea cable severance, or acute disruption in East Asian fabrication hubs."
    keywords:
      - "semiconductor"
      - "chip"
      - "foundry"
      - "tsmc"
      - "euv"
      - "bis"
      - "export control"
      - "gpu"
      - "hbm"
      - "supply chain"
      - "rare earth"
      - "subsea cable"

  european_industrial_realignment:
    id: "european_industrial_realignment"
    title: "European Fiscal, Grid & Dual-Use Industrial Realignment"
    year: "2022-2026"
    summary: "Structural policy shift toward European grid interconnectors, industrial competitiveness, sovereign AI infrastructure, and joint defense/aerospace procurement."
    game_theory_reality: "Multi-year fiscal rules and joint procurement vehicles drive durable R&D capital allocation across energy storage, robotics, state estimation, and autonomous systems."
    red_line_trigger: "Fiscal fragmentation or abrupt suspension of cross-border EU grid and industrial financing mechanisms."
    keywords:
      - "eu"
      - "european"
      - "fiscal"
      - "industrial policy"
      - "defense budget"
      - "procurement"
      - "dual-use"
      - "grid"
      - "interconnector"
      - "nato"
      - "competitiveness"

  multipolar_trade_corridors:
    id: "multipolar_trade_corridors"
    title: "Multipolar Trade Corridors & State-Media Signaling Dynamics"
    year: "2014-2026"
    summary: "Diversification of non-Western commodity settlement rails, alternative overland/maritime corridors, and asymmetric diplomatic signaling through state-aligned outlets."
    game_theory_reality: "State-aligned media narratives project domestic deterrence and negotiating baselines; they must be parsed as executive signaling telemetry rather than neutral factual reporting."
    red_line_trigger: "Secondary financial sanctions blocking major clearing networks or abrupt treaty abrogation across multiple corridors."
    keywords:
      - "brics"
      - "sanctions"
      - "trade corridor"
      - "tariff"
      - "treaty"
      - "diplomacy"
      - "ceasefire"
      - "mediation"
      - "bilateral"
      - "emerging markets"

# 3. Six Diverse Global Source Clusters
source_clusters:
  global_wire:
    name: "Global Wire Services (Balanced International Coverage)"
    description: "Primary international news wires for cross-verifying factual events without clickbait amplification (BBC World, AP News, Deutsche Welle)."
    feeds:
      - name: "BBC World News"
        url: "https://feeds.bbci.co.uk/news/world/rss.xml"
      - name: "AP News World (Google News Feed)"
        url: "https://news.google.com/rss/search?q=site:apnews.com+world&hl=en-US&gl=US&ceid=US:en"
      - name: "Deutsche Welle World"
        url: "https://rss.dw.com/rdf/rss-en-world"
    offline_fallbacks:
      - title: "Multilateral diplomatic talks emphasize maritime trade corridor continuity and treaty compliance"
        link: "https://www.bbc.com/news/world-diplomatic-summit"
        pubDate: "Wed, 25 Nov 2026 08:00:00 GMT"
        source: "BBC World (Baseline)"
        summary: "International delegates reiterate commitment to freedom of navigation and structured de-escalation channels."
      - title: "United Nations maritime briefing reports stable commercial vessel transit volumes across main straits"
        link: "https://apnews.com/article/un-maritime-transit-briefing"
        pubDate: "Wed, 25 Nov 2026 07:30:00 GMT"
