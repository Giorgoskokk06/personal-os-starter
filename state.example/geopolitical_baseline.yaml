      - title: "Transatlantic foreign ministers review industrial resilience and critical infrastructure protocols"
        link: "https://www.dw.com/en/transatlantic-policy-review/a-68900123"
        pubDate: "Wed, 25 Nov 2026 06:45:00 GMT"
        source: "DW World (Baseline)"
        summary: "Policy coordination focuses on subsea cable security, energy grid buffers, and supply chain diversification."

  macro_rates_markets:
    name: "Macro, Rates & Government Bond Markets (Bloomberg / Reuters Proxy)"
