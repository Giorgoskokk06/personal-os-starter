name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline unit and red-team tests
        run: pytest -v
      - name: Run public security and marker audit
        run: python3 scripts/audit_public.py
      - name: Smoke check AST skeletonizer
        run: python3 -m src.skeletonizer src --budget 1200
